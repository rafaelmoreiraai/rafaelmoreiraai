<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
  <title id="t">Rafael Moreira Lima — AI Systems &amp; Autonomous Agents Engineer</title>
  <desc id="d">Dark banner with an agent orchestration graph routing tasks through a planner and agent to an LLM gateway, with a telemetry line.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#0E1722"/>
    </linearGradient>

    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#8B7CF6"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2A37" stroke-width="1" opacity="0.45"/>
    </pattern>

    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#gridFade)"/></mask>

    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- ============ LEFT: identity ============ -->
    <!-- status chip -->
    <rect x="60" y="42" width="186" height="28" rx="14" fill="#111820" stroke="#1F2A37"/>
    <circle cx="78" cy="56" r="4.5" fill="#4FD1C5">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="92" y="60" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#8B98A5">building in public</text>

    <!-- name -->
    <text x="58" y="145" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5" fill="#E6EDF3">Rafael Moreira Lima</text>

    <!-- role -->
    <text x="60" y="190" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#4FD1C5">AI Systems &amp; Autonomous Agents Engineer</text>

    <!-- tagline -->
    <text x="60" y="228" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#8B98A5">agents  ·  llm gateways  ·  observability  ·  planning systems</text>

    <!-- accent bar -->
    <rect x="60" y="258" width="96" height="3" rx="1.5" fill="url(#accent)"/>

    <!-- ============ RIGHT: DAG ORCHESTRATION GRAPH ============ -->
    <g fill="none" stroke="#2A3646" stroke-width="1.5">
      <path id="e1" d="M745 160 C765 160 760 90 780 90"/>
      <path id="e2" d="M745 160 C765 160 760 230 780 230"/>
      <path id="e3" d="M870 90 C890 90 890 160 910 160"/>
      <path id="e4" d="M870 230 C890 230 890 160 910 160"/>
      <path id="e5" d="M1000 160 C1020 160 1020 90 1040 90"/>
      <path id="e6" d="M1000 160 C1020 160 1020 230 1040 230"/>
    </g>

    <!-- animated flow on edges -->
    <g fill="none" stroke="#4FD1C5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 9" opacity="0.9">
      <path d="M745 160 C765 160 760 90 780 90"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M745 160 C765 160 760 230 780 230"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M870 90 C890 90 890 160 910 160"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M870 230 C890 230 890 160 910 160"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M1000 160 C1020 160 1020 90 1040 90"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M1000 160 C1020 160 1020 230 1040 230"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/></path>
    </g>

    <!-- telemetry branch (amber, from gateway down) -->
    <path d="M955 176 V252" stroke="#F5B544" stroke-width="1.2" stroke-dasharray="2 5" opacity="0.8" fill="none">
      <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="955" cy="256" r="3" fill="#F5B544"/>
    <text x="955" y="278" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#F5B544" opacity="0.95">telemetry (tokens · cache)</text>

    <!-- nodes -->
    <g font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace" font-size="13" text-anchor="middle">
      <!-- task -->
      <rect x="655" y="144" width="90" height="32" rx="8" fill="#111820" stroke="#1F2A37"/>
      <text x="700" y="165" fill="#E6EDF3">task</text>

      <!-- planner -->
      <rect x="780" y="74" width="90" height="32" rx="8" fill="#111820" stroke="#1F2A37"/>
      <text x="825" y="95" fill="#E6EDF3">planner</text>

      <!-- agent -->
      <rect x="780" y="214" width="90" height="32" rx="8" fill="#111820" stroke="#1F2A37"/>
      <text x="825" y="235" fill="#E6EDF3">agent</text>

      <!-- gateway (highlight) -->
      <rect x="910" y="144" width="90" height="32" rx="8" fill="#0F1D22" stroke="#4FD1C5" stroke-width="1.5"/>
      <text x="955" y="165" fill="#4FD1C5" font-weight="700">gateway</text>
      <circle cx="955" cy="160" r="22" fill="none" stroke="#4FD1C5" stroke-width="1" opacity="0.3">
        <animate attributeName="r" values="20;26;20" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.05;0.4" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <!-- frontier models -->
      <rect x="1040" y="74" width="105" height="32" rx="8" fill="#111820" stroke="#1F2A37"/>
      <text x="1092" y="95" fill="#E6EDF3" font-size="12">frontier LLM</text>

      <!-- local models -->
      <rect x="1040" y="214" width="105" height="32" rx="8" fill="#111820" stroke="#1F2A37"/>
      <text x="1092" y="235" fill="#E6EDF3" font-size="12">local / tools</text>
    </g>
  </g>
</svg>
